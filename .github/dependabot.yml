version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ['*']
    # sops minor versions change how files are decrypted and verified;
    # take them deliberately, not through Dependabot.
    ignore:
      - dependency-name: github.com/getsops/sops/v3
        update-types: [version-update:semver-minor, version-update:semver-major]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
