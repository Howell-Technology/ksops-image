name: build

# Security model (public repo):
#   - GitHub-hosted runners only. Never run this on self-hosted runners: a
#     pull request from a fork would run its code on them.
#   - pull_request, never pull_request_target: fork PRs get a read-only token
#     and no secrets. Images are pushed only from main and from v* tags.
#   - Every action is pinned to a commit SHA, and every base image to a digest.
#   - Consumers pin the image by digest, so a tag overwrite changes nothing.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/howell-technology/ksops

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache: true

      # Upstream's pinned kustomize (scripts/install-kustomize.sh), installed
      # directly: the script prompts interactively when the runner already has
      # a kustomize, which GitHub's images do. Ours goes first on PATH.
      - name: Install kustomize v5.3.0
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.3.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/kustomize" version

      # The tests run kustomize, which finds ksops through the legacy
      # exec-plugin path: the same layout the Argo CD repo-server uses.
      - name: Build ksops into the plugin home
        run: |
          plug="$RUNNER_TEMP/plugins/viaduct.ai/v1/ksops"
          mkdir -p "$plug"
          CGO_ENABLED=0 go build -trimpath -o "$plug/ksops" .
          cp "$plug/ksops" "$(go env GOPATH)/bin/ksops"
          echo "KUSTOMIZE_PLUGIN_HOME=$RUNNER_TEMP/plugins" >> "$GITHUB_ENV"

      - name: Test
        run: go test -count=1 -v ./...

      - name: govulncheck (reachable vulnerabilities fail the build)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo "Tags: ${{ join(fromJSON(steps.meta.outputs.json).tags, ', ') }}"
          } >> "$GITHUB_STEP_SUMMARY"
